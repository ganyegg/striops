# Striops on Render — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → connect ganyegg/striops
#
# Two web services: API (FastAPI) + UI (Next.js). Default posture uses seed
# facts (no managed Postgres/Neo4j). Set GEMINI_API_KEY in the dashboard for live Ask.
services:
  - type: web
    name: striops-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash scripts/render-api-start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STRIOPS_ENV
        value: production
      - key: STRIOPS_LOG_LEVEL
        value: INFO
      - key: STRIOPS_MUNICIPALITY
        value: CPT
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Managed Postgres — facts store Striops reads from (schema auto-bootstraps).
      - key: POSTGRES_HOST
        fromDatabase:
          name: striops-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: striops-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: striops-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: striops-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: striops-db
          property: password
      # No managed Neo4j in this blueprint — graph uses the in-memory twin.
      - key: NEO4J_URI
        value: bolt://127.0.0.1:1
      # Set in Render Dashboard (Environment) — never commit secrets:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: striops-web
    runtime: node
    plan: free
    region: frankfurt
    # Build from repo root so ../docs and scripts/ resolve (knowledge page + start scripts)
    buildCommand: bash scripts/render-web-build.sh
    startCommand: bash scripts/render-web-start.sh
    # Must NOT be "/" — homepage SSR waits on the API (cold start ~60s) and
    # Render's health check times out, so the deploy never goes live.
    # Prefer a static asset (works on current and new builds, no SSR).
    # /api/health also exists after deploy for explicit monitoring.
    healthCheckPath: /icon.svg
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Do NOT set NODE_ENV=production here — npm would skip devDependencies and
      # `next build` fails (typescript/tailwind missing). Runtime sets production in start script.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Public + SSR API URL → striops-api's onrender.com address
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: striops-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_BASE_URL
        fromService:
          type: web
          name: striops-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Facts store (entities, metrics, budget_lines). Schema is created
  # automatically by striops.persistence.schema.ensure_schema() on first
  # ingest/startup. pgvector is enabled when the plan supports it.
  - name: striops-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []  # reachable only from Render services, not the public internet
