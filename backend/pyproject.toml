[project]
name = "helm-ai-backend"
version = "0.1.0"
description = "Helm AI — Strategic Intelligence Operating System (backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B027: intentional non-abstract no-op hook on the GraphStore interface.
ignore = ["E501", "B027"]
