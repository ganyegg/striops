name: Generate PDF from pitch HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer --no-audit --no-fund

      - name: Create generator script
        run: |
          cat > generate-pdf.js << 'EOF'
          const puppeteer = require('puppeteer');
          const path = require('path');
          (async () => {
            const browser = await puppeteer.launch({args:['--no-sandbox','--disable-setuid-sandbox']});
            const page = await browser.newPage();
            const filePath = 'file://' + path.resolve('docs/pitch/striops-pitch.html');
            await page.goto(filePath, {waitUntil: 'networkidle0'});
            await page.pdf({path:'docs/pitch/striops-pitch.pdf', format:'A4', landscape:true, printBackground:true});
            await browser.close();
            console.log('PDF written to docs/pitch/striops-pitch.pdf');
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch docs/pitch/helm-pitch.pdf || true
          git add docs/pitch/striops-pitch.pdf || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: generate docs/pitch/striops-pitch.pdf from striops-pitch.html (CI)"
            git push
          fi
